version: 2
env:
  - SKIP_PUBLISH={{ if index .Env "SKIP_PUBLISH" }}{{ .Env.SKIP_PUBLISH }}{{ else }}true{{ end }}
  - SKIP_LATEST={{ if index .Env "SKIP_LATEST" }}{{ .Env.SKIP_LATEST }}{{ else }}true{{ end }}
  - SKIP_DOCKER_PUSH={{ if index .Env "SKIP_DOCKER_PUSH" }}{{ .Env.SKIP_DOCKER_PUSH }}{{ else }}false{{ end }}
project_name: auroranet
builds:
  - id: auroranet-wasm
    dir: client/wasm/cmd
    binary: auroranet
    env: [GOOS=js, GOARCH=wasm, CGO_ENABLED=0]
    goos:
      - js
    goarch:
      - wasm
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: auroranet
    dir: client
    binary: auroranet
    env: [CGO_ENABLED=0]
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - arm
      - amd64
      - arm64
      - 386
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: 386
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  # deb and rpm packages target glibc distributions, so on amd64 and arm64, the only
  # architectures with a PKCS#11 driver, they carry the PKCS#11 store, which links libc.
  # Tarballs, the Alpine-based images and the other architectures keep the static build.
  - id: auroranet-pkcs11
    dir: client
    binary: auroranet
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc
      - pkcs11

  # The 32-bit deb architectures, which have no PKCS#11 driver.
  - id: auroranet-deb-32bit
    dir: client
    binary: auroranet
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - arm
      - 386
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  # Single-arch builds: nfpm provides is not templated, so the RPM splits per arch. The
  # ones with a PKCS#11 driver carry the store like the deb build above.
  - &auroranet_rpm_build
    id: auroranet-rpm-amd64
    dir: client
    binary: auroranet
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc
      - pkcs11

  - <<: *auroranet_rpm_build
    id: auroranet-rpm-arm64
    goarch: [arm64]

  - <<: *auroranet_rpm_build
    id: auroranet-rpm-arm
    goarch: [arm]
    tags:
      - load_wgnt_from_rsrc

  - <<: *auroranet_rpm_build
    id: auroranet-rpm-386
    goarch: [386]
    tags:
      - load_wgnt_from_rsrc

  - id: auroranet-static
    dir: client
    binary: auroranet
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - mips
      - mipsle
      - mips64
      - mips64le
    gomips:
      - hardfloat
      - softfloat
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  - id: auroranet-mgmt
    dir: management
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: auroranet-mgmt
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: auroranet-signal
    dir: signal
    env: [CGO_ENABLED=0]
    binary: auroranet-signal
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: auroranet-relay
    dir: relay
    env: [CGO_ENABLED=0]
    binary: auroranet-relay
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: auroranet-server
    dir: combined
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: auroranet-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: auroranet-upload
    dir: upload-server
    env: [CGO_ENABLED=0]
    binary: auroranet-upload
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: auroranet-proxy
    dir: proxy/cmd/proxy
    env: [CGO_ENABLED=0]
    binary: auroranet-proxy
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}} -X main.BuildDate={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: nblink
    dir: client/link/cmd/nblink
    env: [CGO_ENABLED=0]
    binary: nblink
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: auroranet-idp-migrate
    dir: tools/idp-migrate
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: auroranet-idp-migrate
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: auroranet

archives:
  - builds:
      - auroranet
      - auroranet-static
  - id: auroranet-wasm
    builds:
      - auroranet-wasm
    name_template: "{{ .ProjectName }}_{{ .Version }}"
    format: binary
  - id: auroranet-idp-migrate
    builds:
      - auroranet-idp-migrate
    name_template: "auroranet-idp-migrate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: nblink
    builds:
      - nblink
    name_template: "nblink_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # goreleaser archives as tar.gz everywhere unless told otherwise, and
    # nblink is downloaded and extracted by hand on Windows too.
    format_overrides:
      - goos: windows
        format: zip

nfpms:
  - maintainer: AuroraNet <dev@aurora-net.org>
    description: AuroraNet client.
    homepage: https://aurora-net.org/
    license: BSD-3-Clause
    vendor: AuroraNet
    id: auroranet_deb
    bindir: /usr/bin
    builds:
      - auroranet-pkcs11
      - auroranet-deb-32bit
    formats:
      - deb
    contents:
      - src: LICENSE
        dst: /usr/share/doc/auroranet/copyright
        type: license
      - src: README.md
        dst: /usr/share/doc/auroranet/README.md
        type: doc
    scripts:
      postinstall: "release_files/post_install.sh"
      preremove: "release_files/pre_remove.sh"

  - &auroranet_rpm
    maintainer: AuroraNet <dev@aurora-net.org>
    description: AuroraNet client.
    homepage: https://aurora-net.org/
    license: BSD-3-Clause
    vendor: AuroraNet
    id: auroranet_rpm_amd64
    bindir: /usr/bin
    ids:
      - auroranet-rpm-amd64
    formats:
      - rpm
    # Red Hat certification (RPM Version Handling) requires rpmbuild's ISA
    # provide, which nfpm does not emit. The version is filled in by the release job.
    provides:
      - "auroranet(x86-64) = @RPM_EVR@"
    # The client verifies TLS to management and signal against the system trust
    # store. Red Hat software certification (RPM Dependency Tracking) also
    # rejects packages that declare no dependencies at all.
    dependencies:
      - ca-certificates
    # Generated in CI by chglog from git tags; Red Hat certification requires an
    # RPM changelog (RPM Version Handling subtest).
    changelog: changelog.yml
    # License, documentation and a config file so the RPM Provenance subtest sees
    # %license, %doc and %config entries instead of a bare binary.
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/auroranet/LICENSE
        type: license
      - src: README.md
        dst: /usr/share/doc/auroranet/README.md
        type: doc
      - src: release_files/auroranet.sysconfig
        dst: /etc/sysconfig/auroranet
        type: config|noreplace
        # May hold the PKCS#11 token PIN (NB_TPM_PIN), so readable by root alone.
        file_info:
          mode: 0600
    scripts:
      postinstall: "release_files/post_install.sh"
      preremove: "release_files/pre_remove.sh"
    rpm:
      summary: AuroraNet client
      group: Applications/Internet
      packager: AuroraNet <dev@aurora-net.org>
      signature:
        key_file: '{{ if index .Env "GPG_RPM_KEY_FILE" }}{{ .Env.GPG_RPM_KEY_FILE }}{{ end }}'

  - <<: *auroranet_rpm
    id: auroranet_rpm_arm64
    ids:
      - auroranet-rpm-arm64
    provides:
      - "auroranet(aarch-64) = @RPM_EVR@"

  - <<: *auroranet_rpm
    id: auroranet_rpm_arm
    ids:
      - auroranet-rpm-arm
    provides:
      - "auroranet(armv6hl-32) = @RPM_EVR@"

  - <<: *auroranet_rpm
    id: auroranet_rpm_386
    ids:
      - auroranet-rpm-386
    provides:
      - "auroranet(x86-32) = @RPM_EVR@"
