{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{template "title" .}}</title>
<style>
*,::before,::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh;background-color:#101824;color:#e4e7e9;font-family:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji";font-size:14px;line-height:1.5;color-scheme:dark}
.nb-container{max-width:820px;margin:0 auto;padding:64px 16px 40px;display:flex;flex-direction:column;align-items:center}
.nb-logo{display:block;margin-bottom:40px}
.nb-card{width:100%;max-width:400px;padding:40px;background-color:#1B2638;border:1px solid rgba(50,54,61,.5);border-radius:12px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.nb-heading{margin:0 0 12px;font-size:24px;line-height:1.3;font-weight:500;text-align:center;color:#fff;overflow-wrap:anywhere}
.nb-client{font-weight:600}
.nb-subheading{margin:0 0 24px;font-weight:300;letter-spacing:.025em;text-align:center;color:rgba(167,177,185,.8)}
.nb-label{display:block;margin:0 0 8px;font-size:13px;font-weight:500;color:#a7b1b9}
.nb-panel{margin-bottom:16px;padding:12px 14px;background-color:rgba(63,68,75,.25);border:1px solid rgba(63,68,75,.8);border-radius:8px}
.nb-panel-label{margin-bottom:2px}
.nb-panel+form{margin-top:24px}
.nb-host{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:500;color:#fff;overflow-wrap:anywhere}
.nb-warn{display:flex;gap:10px;align-items:flex-start;margin-bottom:24px;padding:12px 14px;font-size:13px;color:#fbbf24;background-color:#33261e;border:1px solid rgba(146,64,14,.5);border-radius:8px}
.nb-warn svg{flex-shrink:0;margin-top:2px}
.nb-error{margin:0;padding:12px 16px;font-size:13px;text-align:center;color:#f87171;background-color:#341e21;border:1px solid rgba(153,27,27,.5);border-radius:8px;overflow-wrap:anywhere}
.nb-icon{display:flex;justify-content:center;margin-bottom:24px}
fieldset{min-width:0;margin:0;padding:0;border:0}
legend{padding:0}
.nb-perm{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;padding:12px 14px;background-color:rgba(63,68,75,.25);border:1px solid rgba(63,68,75,.8);border-radius:8px;cursor:pointer;transition:border-color .2s,background-color .2s}
.nb-perm:hover{border-color:rgba(167,177,185,.4)}
.nb-perm:has(input:checked:enabled){border-color:rgba(45,190,130,.6);background-color:rgba(45,190,130,.06)}
.nb-perm-fixed{cursor:default}
.nb-perm-fixed:hover{border-color:rgba(63,68,75,.8)}
.nb-perm-title{display:block;font-weight:500;color:#e4e7e9}
.nb-perm-desc{display:block;font-size:13px;font-weight:300;color:rgba(167,177,185,.8)}
.nb-check{position:relative;flex-shrink:0;width:18px;height:18px;margin-top:1px}
.nb-check input{appearance:none;-webkit-appearance:none;display:block;width:18px;height:18px;margin:0;background-color:#101824;border:1px solid rgba(167,177,185,.6);border-radius:4px;cursor:pointer;transition:background-color .2s,border-color .2s}
.nb-check input:checked{background-color:#2DBE82;border-color:#2DBE82}
.nb-check input:disabled{background-color:#3f444b;border-color:#3f444b;cursor:default}
.nb-check input:focus-visible{outline:2px solid #2DBE82;outline-offset:2px}
.nb-check svg{position:absolute;top:1px;left:1px;display:none;color:#fff;pointer-events:none}
.nb-check input:checked+svg{display:block}
.nb-check input:disabled+svg{color:#a7b1b9}
.nb-default{position:absolute;width:0;height:0;padding:0;border:0;visibility:hidden}
.nb-actions{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.nb-btn{width:100%;padding:12px 20px;font:inherit;font-weight:500;color:#fff;background-color:#2DBE82;border:1px solid #2DBE82;border-radius:8px;cursor:pointer;transition:background-color .2s,border-color .2s}
.nb-btn:hover:enabled{background-color:#25A771;border-color:#25A771}
.nb-btn:disabled{opacity:.6;cursor:not-allowed}
.nb-btn:focus-visible{outline:2px solid #2DBE82;outline-offset:2px}
.nb-btn-secondary{color:#e4e7e9;background-color:rgba(63,68,75,.5);border-color:rgba(63,68,75,.8)}
.nb-btn-secondary:hover:enabled{background-color:rgba(63,68,75,.8);border-color:#3f444b}
@media (max-width:480px){.nb-container{padding-top:40px}.nb-card{padding:32px 24px}}
</style>
</head>
<body>
<div class="nb-container">
<div class="nb-logo" style="display:flex;align-items:center;justify-content:center;gap:10px;color:#F4F7FA;"><svg width="31" height="31" viewBox="-20 -20 504 476" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g stroke-linecap="round"><g stroke="#3aae8c" stroke-width="5.5" fill="none"><line x1="233" y1="33" x2="33" y2="401"/><line x1="233" y1="33" x2="431" y2="403"/><line x1="233" y1="33" x2="231" y2="165"/><line x1="231" y1="165" x2="123" y2="225"/><line x1="231" y1="165" x2="343" y2="225"/><line x1="231" y1="165" x2="163" y2="288"/><line x1="231" y1="165" x2="301" y2="288"/><line x1="123" y1="225" x2="163" y2="288"/><line x1="343" y1="225" x2="301" y2="288"/><line x1="163" y1="288" x2="301" y2="288"/><line x1="163" y1="288" x2="431" y2="403"/><line x1="301" y1="288" x2="33" y2="401"/><line x1="33" y1="401" x2="163" y2="288"/><line x1="431" y1="403" x2="301" y2="288"/></g><g fill="#2dbe82"><circle cx="233" cy="33" r="33.0"/><circle cx="231" cy="165" r="18.0"/><circle cx="123" cy="225" r="16.0"/><circle cx="343" cy="225" r="16.0"/><circle cx="163" cy="288" r="18.0"/><circle cx="301" cy="288" r="18.0"/><circle cx="33" cy="401" r="32.0"/><circle cx="431" cy="403" r="32.0"/></g></g></svg><span style="font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1;">AuroraNet</span></div>
<main class="nb-card">
{{template "content" .}}
</main>
</div>
{{block "script" .}}{{end}}
</body>
</html>
{{end}}
