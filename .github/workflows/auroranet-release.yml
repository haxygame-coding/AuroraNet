name: AuroraNet Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server and clients
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/netbirdio/netbird/version.version=$VERSION"
          mkdir -p dist/linux/amd64 dist/auroranet-windows-amd64 dist/release
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/auroranet-linux-amd64 ./client
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/auroranet-windows-amd64/auroranet.exe ./client
          CGO_ENABLED=1 go build -trimpath -ldflags "$LDFLAGS" -o dist/linux/amd64/auroranet-server ./combined
          # One binary per service image, laid out as <platform>/<binary> because
          # the management, signal, relay and proxy Dockerfiles copy from dist.
          # management links the sqlite store, which needs cgo.
          CGO_ENABLED=1 go build -trimpath -ldflags "$LDFLAGS" -o dist/linux/amd64/auroranet-mgmt ./management
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/linux/amd64/auroranet-signal ./signal
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/linux/amd64/auroranet-relay ./relay
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/linux/amd64/auroranet-proxy ./proxy/cmd/proxy
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/linux/amd64/auroranet ./client

      - name: Build release archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/netbirdio/netbird/version.version=$VERSION"
          # install.sh and the updater download auroranet_<version>_<os>_<arch>.tar.gz
          # with the binary at the archive root, so every target they accept ships
          # its own archive. The client cross-compiles without cgo.
          for target in linux/amd64 linux/arm64 linux/386 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="dist/archives/${os}-${arch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "$stage/auroranet" ./client
            tar -C "$stage" -czf "dist/release/auroranet_${VERSION}_${os}_${arch}.tar.gz" auroranet
          done

      - name: Build Debian package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          sed -e "s|\${AURORANET_VERSION}|$VERSION|" \
              -e "s|\${AURORANET_BINARY}|$PWD/dist/auroranet-linux-amd64|" \
              packaging/nfpm.yaml > dist/nfpm-resolved.yaml
          "$(go env GOPATH)/bin/nfpm" package --config dist/nfpm-resolved.yaml \
            --packager deb --target "dist/release/auroranet_${VERSION}_amd64.deb"

      - name: Build Arch package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp dist/auroranet-linux-amd64 LICENSE packaging/arch/
          cp packaging/README.md packaging/arch/README.md
          docker run --rm -v "$PWD:/src" -w /src/packaging/arch archlinux:latest bash -lc "
            sed -i 's|^pkgver=.*|pkgver=${VERSION}|' PKGBUILD &&
            pacman -Sy --noconfirm --quiet base-devel >/dev/null &&
            useradd -m builder && chown -R builder:builder /src/packaging/arch &&
            su builder -c 'makepkg --nodeps --noconfirm'"
          cp packaging/arch/*.pkg.tar.zst dist/release/

      - name: Build Windows MSI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL https://www.wintun.net/builds/wintun-0.14.1.zip -o /tmp/wintun.zip
          unzip -j -o /tmp/wintun.zip '*/bin/amd64/wintun.dll' -d dist/auroranet-windows-amd64 >/dev/null
          sed "s|@VERSION@|$VERSION|" client/auroranet.wxs > dist/auroranet-msi.wxs
          docker run --rm -v "$PWD:/src" -v "$PWD/dist/auroranet-msi.wxs:/tmp/auroranet.wxs:ro" \
            -w /src archlinux:latest bash -lc "
              pacman -Sy --noconfirm --quiet msitools >/dev/null &&
              wixl -o dist/release/auroranet_${VERSION}_windows_amd64.msi /tmp/auroranet.wxs"

      - name: Build and push images
        env:
          # proxy/Dockerfile uses COPY --chmod, which only BuildKit supports.
          DOCKER_BUILDKIT: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Every image the compose templates and installers reference is built
          # here, so their tags never point at something that was not published.
          push_image() {
            local name="$1" dockerfile="$2" context="$3"
            local ref="ghcr.io/haxygame-coding/${name}"
            docker build -f "${dockerfile}" --build-arg TARGETPLATFORM=linux/amd64 \
              -t "${ref}:${VERSION}" -t "${ref}:latest" "${context}"
            docker push "${ref}:${VERSION}"
            docker push "${ref}:latest"
          }

          push_image auroranet-server combined/Dockerfile dist
          push_image auroranet-management management/Dockerfile dist
          push_image auroranet-signal signal/Dockerfile dist
          push_image auroranet-relay relay/Dockerfile dist
          push_image auroranet-proxy proxy/Dockerfile dist

          # The client Dockerfile copies the entrypoint from the repo root, so it
          # builds from the checkout with the binary passed explicitly.
          docker build -f client/Dockerfile --build-arg AURORANET_BINARY=dist/linux/amd64/auroranet \
            -t "ghcr.io/haxygame-coding/auroranet-client:${VERSION}" -t ghcr.io/haxygame-coding/auroranet-client:latest .
          docker push "ghcr.io/haxygame-coding/auroranet-client:${VERSION}"
          docker push ghcr.io/haxygame-coding/auroranet-client:latest

      - name: Checksums and signature
        run: |
          cd dist/release
          sha256sum ./*.deb ./*.pkg.tar.zst ./*.msi ./*.tar.gz > SHA256SUMS
          if [[ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]]; then
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
            gpg --batch --yes --armor --detach-sign SHA256SUMS
            for f in ./*.deb ./*.pkg.tar.zst ./*.msi ./*.tar.gz; do gpg --batch --yes --armor --detach-sign "$f"; done
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true

      # The tap only exists once HOMEBREW_TAP_GITHUB_TOKEN can write to it; the
      # step is skipped rather than failing the release when it is absent.
      - name: Publish Homebrew formula
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_GITHUB_TOKEN is not set, skipping the Homebrew tap update"
            exit 0
          fi
          bash release_files/publish-homebrew-formula.sh "${GITHUB_REF_NAME#v}" dist/release
